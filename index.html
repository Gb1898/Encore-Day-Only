<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LES | Hybrid Weather (NWS + Open-Meteo)</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}.bar{height:100%;width:100%;display:grid;grid-template-columns:1.05fr 1.22fr 1.05fr;gap:12px;padding:5px 8px}.tile{min-width:0;height:100%;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 18px;border:2px solid rgba(199,151,226,.6);border-radius:15px;background:linear-gradient(135deg,rgba(33,14,49,.96),rgba(57,27,74,.94));box-shadow:0 4px 16px rgba(0,0,0,.18)}.icon{flex:0 0 auto;width:43px;height:43px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.clock{font-size:clamp(20px,2.75vw,48px);font-weight:700;white-space:nowrap;letter-spacing:-.025em}.middle{gap:16px}.date{font-size:clamp(19px,1.8vw,32px);font-weight:700;line-height:1.18}.date small{display:block;font-size:.88em;font-weight:500;margin-top:2px}.weather{display:flex;align-items:center;gap:9px;white-space:nowrap}.weather-icon{font-size:clamp(26px,3vw,49px)}.temp{font-size:clamp(20px,2.4vw,39px);font-weight:700}.condition{font-size:clamp(12px,1.3vw,20px)}.separator{height:65%;width:1px;background:rgba(255,255,255,.45);flex:0 0 auto}.rotation{font-size:clamp(20px,2.6vw,46px);font-weight:700;white-space:nowrap;text-align:center}.rotation.long{font-size:clamp(15px,1.8vw,30px)}@media(max-width:850px){.bar{gap:5px;padding:3px}.tile{padding:5px 8px;gap:7px;border-radius:9px}.icon{width:24px;height:24px}.middle{gap:6px}.weather-icon{font-size:22px}.clock{font-size:clamp(14px,3vw,25px)}.rotation{font-size:clamp(13px,2.5vw,22px)}.date{font-size:clamp(13px,2vw,21px)}.temp{font-size:clamp(13px,2vw,22px)}.condition{font-size:11px}}</style></head><body><div class="bar"><section class="tile" aria-label="Current time"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg><div class="clock" id="clock">--:--:-- AM</div></section><section class="tile middle" aria-label="Date and local weather"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><div class="date"><span id="weekday">Loading…</span><small id="calendar-date"></small></div><div class="separator"></div><div class="weather"><span id="weather-icon" class="weather-icon">🌡️</span><div><div class="temp" id="temp">--°F</div><div class="condition" id="condition">Loading…</div></div></div></section><section class="tile" aria-label="Encore rotation day"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 14 2 2 4-4"/></svg><div class="rotation" id="rotation">Loading Day…</div></section></div><script>const ZONE='America/New_York';const LAT=40.3706,LON=-79.9789;const $=id=>document.getElementById(id);let encoreData=null;function dateParts(now){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]))}function render(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:ZONE,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now);$('weekday').textContent=new Intl.DateTimeFormat('en-US',{timeZone:ZONE,weekday:'long'}).format(now);$('calendar-date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:ZONE,month:'long',day:'numeric',year:'numeric'}).format(now);if(encoreData!==null){const p=dateParts(now),day=encoreData[`${p.year}-${p.month}-${p.day}`]?.day,number=day?String(day).replace(/^D/i,''):null;const el=$('rotation');el.textContent=number?`Today is a Day ${number}`:'No Encore Day';el.classList.toggle('long',!number)}}function setWeather(temp,label,icon){$('temp').textContent=`${Math.round(temp)}°F`;$('condition').textContent=label;$('weather-icon').textContent=icon}function unavailable(e){console.warn('Weather unavailable',e);$('condition').textContent='Unavailable';$('weather-icon').textContent='🌡️'}function weatherLabel(code,isDay){if(code===0)return[isDay?'Sunny':'Clear',isDay?'☀️':'🌙'];if(code===1)return[isDay?'Mostly Sunny':'Mostly Clear',isDay?'🌤️':'🌙'];if(code===2)return['Partly Cloudy','⛅'];if(code===3)return['Cloudy','☁️'];if([45,48].includes(code))return['Foggy','🌫️'];if([51,53,55,56,57].includes(code))return['Drizzle','🌦️'];if([61,63,65,66,67,80,81,82].includes(code))return['Rain','🌧️'];if([71,73,75,77,85,86].includes(code))return['Snow','❄️'];if([95,96,99].includes(code))return['Storms','⛈️'];return['Weather','🌡️']}render();setInterval(render,1000);// Hybrid: observed NWS temperature + Open-Meteo conditions/icons.
// Keep the two providers independent so one failure does not erase the other.
let stationsCache = null;
async function getNwsJSON(url) {
  const response = await fetch(url, {headers:{Accept:'application/geo+json'},cache:'no-store'});
  if (!response.ok) throw Error(`NWS HTTP ${response.status}`);
  return response.json();
}
async function findStations() {
  const point = await getNwsJSON(`https://api.weather.gov/points/${LAT},${LON}`);
  const url = point.properties?.observationStations;
  if (!url) throw Error('NWS stations unavailable');
  const stations = await getNwsJSON(url);
  const ids = (stations.features || []).map(f => f.properties?.stationIdentifier).filter(Boolean);
  if (!ids.length) throw Error('No NWS stations');
  return ids.slice(0,5);
}
async function updateNwsTemperature() {
  try {
    if (!stationsCache) stationsCache = await findStations();
    for (const station of stationsCache) {
      try {
        const data = await getNwsJSON(`https://api.weather.gov/stations/${encodeURIComponent(station)}/observations/latest`);
        const observation = data.properties || {};
        const celsius = observation.temperature?.value;
        const observedAt = Date.parse(observation.timestamp || '');
        if (!Number.isFinite(celsius) || !Number.isFinite(observedAt)) continue;
        if (Math.abs(Date.now()-observedAt) > 3*3600000) continue;
        $('temp').textContent = `${Math.round(celsius * 9/5 + 32)}°F`;
        return;
      } catch (error) { console.warn('NWS station failed:', station, error); }
    }
    throw Error('No recent valid NWS temperature observations');
  } catch (error) {
    console.warn('NWS temperature unavailable', error);
    // Keep the last successful reading instead of replacing it with a misleading value.
    if ($('temp').textContent === '--°F') $('temp').textContent = 'N/A';
    stationsCache = null;
  }
}
async function updateOpenMeteoConditions() {
  try {
    const params = new URLSearchParams({
      latitude:String(LAT), longitude:String(LON),
      current:'weather_code,is_day', timezone:ZONE, forecast_days:'1'
    });
    const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`,{cache:'no-store'});
    if (!response.ok) throw Error(`Open-Meteo HTTP ${response.status}`);
    const current = (await response.json()).current;
    if (!Number.isFinite(current?.weather_code)) throw Error('Invalid weather conditions');
    const [label, icon] = weatherLabel(current.weather_code, Boolean(current.is_day));
    $('condition').textContent = label;
    $('weather-icon').textContent = icon;
  } catch (error) {
    console.warn('Open-Meteo conditions unavailable', error);
    if ($('condition').textContent === 'Loading…') $('condition').textContent = 'Unavailable';
  }
}
function updateWeather() {
  void updateNwsTemperature();
  void updateOpenMeteoConditions();
}
updateWeather();
setInterval(updateWeather,600000);
</script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js';const firebaseConfig={apiKey:'AIzaSyBcHWGBSNu9LJUHhbahQqKDpNZYSufza90',authDomain:'les-live.firebaseapp.com',databaseURL:'https://les-live-default-rtdb.firebaseio.com',projectId:'les-live',appId:'1:76711441074:web:7ab3de7e6e0b905ed94fab'};try{const app=initializeApp(firebaseConfig);onValue(ref(getDatabase(app),'sites/clock-site/encore'),snap=>{encoreData=snap.val()||{};render()},error=>{$('rotation').textContent='Rotation Unavailable';console.warn(error)})}catch(error){$('rotation').textContent='Rotation Unavailable';console.warn(error)}</script></body></html>
